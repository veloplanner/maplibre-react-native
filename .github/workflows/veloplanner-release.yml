# Fork-only: on a v*-veloplanner.* tag push, run the full upstream Review suite
# (lint TSC/ESLint/Ktlint, tests, library/docs builds, Android + iOS example
# builds), then pack the package and attach the tarball to a GitHub release.
# The VeloPlanner app consumes the release-asset URL in its package.json.
name: veloplanner-release

on:
  push:
    tags:
      - "v*-veloplanner.*"

jobs:
  review:
    name: Review
    uses: ./.github/workflows/review.yml

  release:
    name: Release
    needs: [review]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Pack
        run: npm pack
        working-directory: package

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" package/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes "Fork prerelease for VeloPlanner. See branch \`veloplanner\` for the included fixes."
        env:
          GH_TOKEN: ${{ github.token }}
