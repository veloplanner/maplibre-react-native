appId: org.maplibre.reactnative.example
---
- launchApp

# The first cold starts after install are slow on CI simulators; without this
# they eat into the tap/find timeouts below and flake the first flows.
- extendedWaitUntil:
    visible: "E2E Tests, ›"
    timeout: 60000

- tapOn: "E2E Tests, ›"
- extendedWaitUntil:
    visible:
      id: "MapLibre React Native > E2E Tests"
    timeout: 20000

- scrollUntilVisible:
    element:
      text: "${TEST_GROUP}, ›"
- tapOn: "${TEST_GROUP}, ›"
- extendedWaitUntil:
    visible:
      id: "MapLibre React Native > E2E Tests > ${TEST_GROUP}"
    timeout: 20000

- scrollUntilVisible:
    element:
      text: "${TEST_NAME}, ›"
- tapOn: "${TEST_NAME}, ›"

- assertVisible: "${TEST_NAME}"
- waitForAnimationToEnd
